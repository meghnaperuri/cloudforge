name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    name: Build CareerFlow API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CareerFlow
        uses: actions/checkout@v4
        with:
          repository: meghnaperuri/careerflow
          path: careerflow
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./careerflow/backend
          push: false
          tags: careerflow-api:ci
